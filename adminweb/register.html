<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HopeGive — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Firebase CDN -->
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
  import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAlFuluvqONN0GfRfkv1CF85rGdm75dOoU",
    authDomain: "ulamshare-4f2b9.firebaseapp.com",
    databaseURL: "https://ulamshare-4f2b9-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ulamshare-4f2b9",
    storageBucket: "ulamshare-4f2b9.firebasestorage.app",
    messagingSenderId: "521750995424",
    appId: "1:521750995424:web:3f26ee1e971685409ecb85",
    measurementId: "G-67NLB4FRVF"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const firestore = getFirestore(app);

  // Make Firebase available globally
  window.firebaseApp = app;
  window.firebaseAnalytics = analytics;
  window.firebaseAuth = auth;

  function normalizeRole(role) {
    const key = String(role || "")
      .trim()
      .toLowerCase()
      .replaceAll("-", "_")
      .replaceAll(" ", "_");
    if (key === "superadmin") return "super_admin";
    if (key === "mod") return "moderator";
    if (["super_admin", "admin", "moderator", "support"].includes(key)) return key;
    return "user";
  }

  function displayRole(roleKey) {
    switch (normalizeRole(roleKey)) {
      case "super_admin":
        return "Super Admin";
      case "admin":
        return "Admin";
      case "moderator":
        return "Moderator";
      case "support":
        return "Support";
      default:
        return "User";
    }
  }

  // Handle register form
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      if (!username || !email || !password || !confirmPassword) {
        alert('Please fill all fields');
        return;
      }
      if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
      }
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(userCredential.user, { displayName: username });
        const uid = userCredential.user.uid;
        const normalizedRole = normalizeRole(document.getElementById('role').value);
        const role = displayRole(normalizedRole);
        const now = Date.now();
        console.log("Registered Auth user uid:", uid);
        console.log("Saving team user to Realtime Database:", uid, role);
        const realtimeUserRef = ref(db, `users/${uid}`);
        const realtimeSnap = await get(realtimeUserRef).catch(() => null);
        const realtimeExisting = realtimeSnap?.exists() ? (realtimeSnap.val() || {}) : {};
        await update(realtimeUserRef, {
          uid,
          email,
          username,
          fullName: username,
          role,
          roleKey: normalizedRole,
          isActiveUser: true,
          isDuplicate: false,
          createdAt: realtimeExisting.createdAt || now,
          updatedAt: now
        });

        console.log("Saving team user to Firestore:", uid, normalizedRole);
        const userDocRef = doc(firestore, 'users', uid);
        const existingFirestoreSnap = await getDoc(userDocRef).catch(() => null);
        const existingFirestore = existingFirestoreSnap?.exists() ? (existingFirestoreSnap.data() || {}) : {};
        const firestorePayload = {
          uid,
          email,
          username,
          fullName: username,
          role: normalizedRole,
          roleKey: normalizedRole,
          displayRole: role,
          authProvider: "email",
          isActiveUser: true,
          isDuplicate: false,
          updatedAt: serverTimestamp()
        };
        if (!existingFirestoreSnap?.exists()) {
          firestorePayload.createdAt = serverTimestamp();
        }
        [
          ['friendsCount', 0],
          ['followingCount', 0],
          ['followersCount', 0],
          ['totalDonated', 0],
          ['donationsCount', 0],
          ['campaignsDonatedCount', 0]
        ].forEach(([field, fallback]) => {
          if (existingFirestore[field] == null) firestorePayload[field] = fallback;
        });
        await setDoc(userDocRef, firestorePayload, { merge: true });
        alert('Registration successful! Please login.');
        window.location.href = 'login.html';
      } catch (error) {
        console.error('Registration error:', error);
        alert('Registration failed: ' + error.message);
      }
    });
  });

  // Toggle password visibility
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');
  toggleBtn.addEventListener('click', () => {
    const type = passwordInput.type === 'password' ? 'text' : 'password';
    passwordInput.type = type;
    toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
  });

  const toggleConfirmBtn = document.getElementById('toggle-confirm-password');
  const confirmPasswordInput = document.getElementById('confirm-password');
  toggleConfirmBtn.addEventListener('click', () => {
    const type = confirmPasswordInput.type === 'password' ? 'text' : 'password';
    confirmPasswordInput.type = type;
    toggleConfirmBtn.textContent = type === 'password' ? '👁️' : '🙈';
  });
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0A0F1E;--navy2:#111827;--navy3:#1a2236;--navy4:#1f2a40;
  --border:#ffffff12;--border2:#ffffff20;
  --text:#E8EDF5;--muted:#7C8FA6;--hint:#4A5568;
  --accent:#2F80ED;--accent2:#1a5fb5;
  --green:#27AE60;--amber:#F2994A;--red:#E53E3E;--purple:#7C5CBF;
  --card:#111827;--font-serif:'Instrument Serif',serif;
  --font-mono:'DM Mono',monospace;--font-sans:'Geist',sans-serif;
}
html,body{height:100%;background:var(--navy);color:var(--text);font-family:var(--font-sans)}
.register-container{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.register-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:400px}
.register-title{font-family:var(--font-serif);font-size:24px;text-align:center;margin-bottom:30px;color:var(--text)}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
.form-input{width:100%;padding:12px;background:var(--navy2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.form-input:focus{outline:none;border-color:var(--accent)}
.form-select{width:100%;padding:12px;background:var(--navy2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.form-select:focus{outline:none;border-color:var(--accent)}
.register-btn{width:100%;padding:12px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.register-btn:hover{background:var(--accent2)}
.login-link{text-align:center;margin-top:20px;font-size:14px;color:var(--muted)}
.login-link a{color:var(--accent);text-decoration:none}
.login-link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="register-container">
  <div class="register-card">
    <h1 class="register-title">Register Account</h1>
    <form action="#" method="post">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" class="form-input" required>
          <button type="button" id="toggle-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px;">👁️</button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm-password" class="form-label">Confirm Password</label>
        <div style="position: relative;">
          <input type="password" id="confirm-password" name="confirm-password" class="form-input" required>
          <button type="button" id="toggle-confirm-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px;">👁️</button>
        </div>
      </div>
      <div class="form-group">
        <label for="role" class="form-label">Role</label>
        <select id="role" name="role" class="form-select" required>
          <option value="">Select Role</option>
          <option value="Super Admin">Super Admin</option>
          <option value="Admin">Admin</option>
          <option value="Moderator">Moderator</option>
          <option value="Support">Support</option>
          <option value="Viewer">Viewer</option>
        </select>
      </div>
      <button type="submit" class="register-btn">Register</button>
    </form>
    <div class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>
</div>
</body>
</html>
